<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do filme | Cine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Cine</h1>
        <nav aria-label="Navegação prinicipal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="perfil.html">Meu perfil</a></li>
                <li><a href="sobre.html">Sobre</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="detalhes-filme">
            <h2 id="titulo-filme"></h2>

            <img src="" alt="Pôster do filme" id="poster-filme">

            <p id="ano-filme"></p>
            <p id="genero-filme"></p>

            <h3>Sinopse</h3>
            <p id="sinopse-filme"></p>

            <div class="acoes-filme">
                <button type="button">Adicionar aos favoritos</button>
                <button type="button">Marcar como assistido</button>
                <button type="button">Quero assistir</button>
            </div>

            <div class="avaliacao-filme">
                <h3>Avalie este filme</h3>
                <label for="avaliacao">Sua nota:</label>
                <input type="range" id="avaliacao" name="avaliacao" min="0" max="5" step="0.5" value="2.5">
            </div>
        </section>

        <section class="comentarios">
            <h2>Comentários</h2>

            <form>
                <label for="comentario">Deixe sua opinião:</label>
                <textarea id="comentario" name="comentario" rows="5" placeholder="Escreva seu comentário..." required></textarea>

                <button type="submit">Enviar comentário</button>
            </form>

            <div class="lista-comentarios">
                <!--Os comentários serão adicionados pelo JS-->
            </div>
        </section>
    </main>
    <footer>
        <p>Cine</p>
        <nav aria-label="Navegação do rodapé">
            <ul>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="sobre.html#feedback">Feedback</a></li>
            </ul>
        </nav>
        <p>&copy; 2026 Cine. Todos os direitos reservados.</p>
    </footer>
</body>
</html>

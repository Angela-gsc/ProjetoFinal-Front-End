<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalie nosso site</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Cine</h1>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html" aria-current="page">Início</a></li>
                <li><a href="perfil.html">Meu perfil</a></li>
                <li><a href="filmes.html">Catálogo</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="feedback.html" aria-current="page">Feedback</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="feedback" id="feedback">
            <h2>Envie seu feedback</h2>
            <p>Sua opinião é importante para nós!
                Compartilhe suas sugestões, dúvidas ou comentários sobre o Cine.
            </p>

            <form id="form-feedback">
                <fieldset>
                    <legend>Dados pessoais</legend>
                        
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                        
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </fieldset>
                <fieldset>
                    <legend>Sua opinião</legend>
                    
                    <label for="avaliacao">Avalie nosso site (0 a 5):</label>
                    <input type="range" id="avaliacao" name="avaliacao" min="0" max="5" step="0.5" value="2.5">
                    
                    <label for="mensagem">Deixe seu comentário:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem..." required></textarea>
                </fieldset>

                <button type="submit">Enviar feedback</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Cine</p>
        <p>&copy; 2026 Cine. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
